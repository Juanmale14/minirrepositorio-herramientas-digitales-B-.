<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio: Mi Tuttifruti</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        /* Contenedor de Filtros */
        .controls-container {
            max-width: 800px;
            margin: 0 auto 3rem auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--radius);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        #searchInput {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .tag-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .filter-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 0.4rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: var(--shadow);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .card-image-container {
            width: 100%;
            height: 200px;
            background: #cbd5e1;
            overflow: hidden;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .card-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            min-height: 4.5em;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tag {
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: white;
            padding: 0.75rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            header h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Herramientas Digitales</h1>
        
        <div class="controls-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por título o palabra clave...">
            </div>
            <div class="tag-filters" id="tagFilters">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="Primaria">Primaria</button>
                <button class="filter-btn" data-filter="ESO">ESO</button>
                <button class="filter-btn" data-filter="Lengua">Lengua</button>
            </div>
        </div>
    </header>

    <main id="appGrid" class="grid">
        <!-- Contenido dinámico -->
    </main>

    <script>
        const data = [
            {
                titulo: "Mi Tuttifruti",
                descripcion: "Es el juego tradicional del \"Tutifruti\" que consiste en pensar en palabras de distintos temas que empiecen por una misma letra.",
                etapa: "Primaria / ESO",
                asignatura: "Lengua",
                enlace: "https://juanmale14.github.io/juego-tutti-fruti/",
                imagen: "https://images.unsplash.com/photo-1543362906-acfc16c623a2?w=800"
            }
        ];

        const grid = document.getElementById('appGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        let currentFilter = 'all';

        function renderCards(items) {
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<div class="no-results">No se han encontrado herramientas con esos criterios.</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-image-container">
                        <img src="${item.imagen}" alt="${item.titulo}" onerror="this.src='https://images.unsplash.com/photo-1484417894907-623942c8ee29?w=800'">
                    </div>
                    <div class="card-content">
                        <h2 class="card-title">${item.titulo}</h2>
                        <p class="card-description">${item.descripcion}</p>
                        <div class="tags">
                            <span class="tag">${item.etapa}</span>
                            <span class="tag">${item.asignatura}</span>
                        </div>
                        <div class="card-footer">
                            <a href="${item.enlace}" target="_blank" class="btn">Abrir Aplicación</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterData() {
            const searchTerm = searchInput.value.toLowerCase();
            
            const filtered = data.filter(item => {
                const matchesSearch = item.titulo.toLowerCase().includes(searchTerm) || 
                                    item.descripcion.toLowerCase().includes(searchTerm);
                
                const matchesTag = currentFilter === 'all' || 
                                 item.etapa.includes(currentFilter) || 
                                 item.asignatura.includes(currentFilter);
                
                return matchesSearch && matchesTag;
            });

            renderCards(filtered);
        }

        // Eventos para los botones de etiqueta
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                filterData();
            });
        });

        // Evento para el buscador de texto
        searchInput.addEventListener('input', filterData);

        // Inicialización
        window.onload = () => renderCards(data);

    </script>
</body>
</html>
